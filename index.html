<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meal Delivery Service</title>
<link rel="stylesheet" href = "styles.css">
</head>

<body>

<h1>Weekly Meal Delivery</h1>

<div class="container">

<p>Select your meal plan:</p>

<select id="mealPlan">
    <option value="Regular">Regular</option>
    <option value="Vegan">Vegan</option>
</select>

<br><br>

<button onclick="goToCheckout()">Continue to Checkout</button>

</div>

<script>
function goToCheckout(){
    let plan = document.getElementById("mealPlan").value;
    window.location.href = "checkout.html?plan=" + plan;
}
</script>

</body>
</html>
