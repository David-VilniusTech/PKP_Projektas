<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meal Delivery Service</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    margin-top: 120px;
}

.container{
    background: #f4f4f4;
    padding: 30px;
    display: inline-block;
    border-radius: 10px;
}

select, button{
    padding: 10px;
    font-size: 16px;
    margin-top: 10px;
}

button{
    background-color: #29ae48;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Weekly Meal Delivery</h1>

<div class="container">

<p>Select your meal plan:</p>

<select id="mealPlan">
    <option value="Regular">Regular</option>
    <option value="Vegan">Vegan</option>
</select>

<br><br>

<button onclick="goToCheckout()">Continue to Checkout</button>

</div>

<script>
function goToCheckout(){
    let plan = document.getElementById("mealPlan").value;
    window.location.href = "checkout.html?plan=" + plan;
}
</script>

</body>
</html>
