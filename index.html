  const tbody = document.getElementById("menuBody");

  menus[plan].forEach(row => {

  <td>${row.breakfast}</td>
  <td>${row.lunch}</td>
  <td>${row.dinner}</td>
  <td>${row.nutrition.kcal} kcal</td>

  <td>${row.nutrition.carbs} g</td>
  <td>${row.nutrition.fat} g</td>
  <td>${row.nutrition.fiber} g</td>
</tr>`;

}
